<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function() {
        try {
          var target = typeof window !== 'undefined' ? window : (typeof globalThis !== 'undefined' ? globalThis : null);
          if (target && target.fetch) {
            var _activeFetch = target.fetch;
            try {
              Object.defineProperty(target, 'fetch', {
                get: function() {
                  return _activeFetch;
                },
                set: function(fn) {
                  _activeFetch = fn;
                },
                configurable: true,
                enumerable: true
              });
            } catch (err) {
              // Silently handle if property is locked
            }
          }
        } catch (_) {}
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (function() {
        try {
          var savedTheme = localStorage.getItem('theme_preference');
          var userStr = localStorage.getItem('user_profile');
          var theme = savedTheme || 'light';
          if (!savedTheme && userStr) {
            var user = JSON.parse(userStr);
            if (user && user.theme) {
              theme = user.theme;
            }
          }
          var isDark = theme === 'dark' || (theme === 'system' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
            document.body && document.body.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
            document.body && document.body.classList.remove('dark');
          }
        } catch (_) {}
      })();
    </script>
    <title>Daily Task Tracker</title>
    <meta name="description" content="A modern, minimal, premium daily task and goal tracking productivity web application with accurate timers, streaks, recovery balance, and certificates." />
    <meta property="og:title" content="Daily Task Tracker" />
    <meta property="og:description" content="A modern, minimal, premium daily task and goal tracking productivity web application with accurate timers, streaks, recovery balance, and certificates." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/logo.svg" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#0c0a09" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="TaskTracker" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/pwa-192x192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300..800;1,300..800&family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
    <script src="https://accounts.google.com/gsi/client" async defer></script>
  </head>
  <body class="bg-stone-50 dark:bg-stone-950 text-stone-900 dark:text-stone-100 antialiased selection:bg-amber-500/20 selection:text-amber-900 dark:selection:text-amber-200">
    <div id="root">
      <div id="app-opening-splash" style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background-color: #fafaf9; color: #1c1917; padding: 1.5rem; user-select: none; font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;">
        <style>
          @media (prefers-color-scheme: dark) {
            #app-opening-splash {
              background-color: #0c0a09 !important;
              color: #f5f5f4 !important;
            }
            #app-opening-title {
              color: #f5f5f4 !important;
            }
          }
          .dark #app-opening-splash {
            background-color: #0c0a09 !important;
            color: #f5f5f4 !important;
          }
          .dark #app-opening-title {
            color: #f5f5f4 !important;
          }
          @keyframes openingPulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.88; transform: scale(0.97); }
          }
          @keyframes openingSpin {
            to { transform: rotate(360deg); }
          }
        </style>
        <div style="display: flex; flex-direction: column; align-items: center; gap: 1rem; text-align: center; max-width: 24rem;">
          <img
            src="/logo.svg"
            alt="Daily Task Tracker Logo"
            style="width: 84px; height: 84px; object-fit: contain; filter: drop-shadow(0 4px 6px rgba(0,0,0,0.08)); animation: openingPulse 2s ease-in-out infinite;"
          />
          <div style="display: flex; flex-direction: column; align-items: center;">
            <span id="app-opening-title" style="font-weight: 800; font-size: 1.75rem; letter-spacing: -0.025em; line-height: 1; color: #1c1917;">
              Daily Task
            </span>
            <span style="font-size: 0.75rem; font-weight: 700; color: #059669; letter-spacing: 0.1em; text-transform: uppercase; margin-top: 4px;">
              Tracker
            </span>
            <span style="font-size: 0.75rem; color: #a8a29e; margin-top: 0.75rem; font-weight: 500;">
              Loading workspace...
            </span>
          </div>
          <div style="width: 28px; height: 28px; border: 2.5px solid #059669; border-top-color: transparent; border-radius: 9999px; animation: openingSpin 0.8s linear infinite; margin-top: 0.25rem;"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
