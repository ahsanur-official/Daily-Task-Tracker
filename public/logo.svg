<svg xmlns="http://www.w3.org/2000/svg" viewBox="-25 -25 650 650" width="600" height="600" preserveAspectRatio="xMidYMid meet" style="overflow: visible;">
  <defs>
    <!-- Outer Gradient Ring -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="35%" stop-color="#06b6d4" />
      <stop offset="70%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#0066ff" />
    </linearGradient>

    <!-- Clock Ring Gradient -->
    <linearGradient id="clockGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Leaves Gradient -->
    <linearGradient id="leafGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#15803d" />
      <stop offset="60%" stop-color="#22c55e" />
      <stop offset="100%" stop-color="#4ade80" />
    </linearGradient>

    <!-- Soft Drop Shadow for Elements -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f2b48" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- Background Circle (White) -->
  <circle cx="300" cy="300" r="280" fill="#ffffff" />

  <!-- Outer Cyan/Blue/Green Gradient Ring -->
  <circle cx="300" cy="300" r="264" fill="none" stroke="url(#ringGrad)" stroke-width="26" stroke-linecap="round" />

  <!-- CLIPBOARD & CHECKLIST (Shifted slightly left) -->
  <g filter="url(#shadow)">
    <!-- Clipboard Body -->
    <rect x="175" y="115" width="195" height="250" rx="36" fill="#162c50" />
    <rect x="187" y="127" width="171" height="226" rx="28" fill="#ffffff" />

    <!-- Clipboard Top Clip -->
    <!-- Clip Base -->
    <path d="M 235 127 C 235 105, 310 105, 310 127 Z" fill="#162c50" />
    <rect x="242" y="90" width="60" height="30" rx="14" fill="#162c50" />
    <circle cx="272" cy="102" r="7" fill="#ffffff" />

    <!-- Checklist Item 1 -->
    <rect x="206" y="165" width="40" height="40" rx="10" fill="#16a34a" />
    <path d="M 215 185 L 223 193 L 237 175" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
    <rect x="256" y="174" width="70" height="7" rx="3.5" fill="#94a3b8" />
    <rect x="256" y="189" width="45" height="7" rx="3.5" fill="#cbd5e1" />

    <!-- Checklist Item 2 -->
    <rect x="206" y="217" width="40" height="40" rx="10" fill="#16a34a" />
    <path d="M 215 237 L 223 245 L 237 227" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
    <rect x="256" y="226" width="65" height="7" rx="3.5" fill="#94a3b8" />
    <rect x="256" y="241" width="38" height="7" rx="3.5" fill="#cbd5e1" />

    <!-- Checklist Item 3 -->
    <rect x="206" y="269" width="40" height="40" rx="10" fill="#16a34a" />
    <path d="M 215 289 L 223 297 L 237 279" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
    <rect x="256" y="278" width="55" height="7" rx="3.5" fill="#94a3b8" />
    <rect x="256" y="293" width="32" height="7" rx="3.5" fill="#cbd5e1" />
  </g>

  <!-- ORGANIC GREEN LEAVES (Behind Clock) -->
  <g>
    <!-- Big Leaf -->
    <path d="M 375 250 C 375 190, 440 145, 470 145 C 470 185, 450 250, 395 265 Z" fill="url(#leafGrad)" />
    <path d="M 390 255 Q 430 200 460 155" fill="none" stroke="#15803d" stroke-width="3" stroke-linecap="round" opacity="0.4" />
    
    <!-- Small Leaf -->
    <path d="M 405 270 C 420 220, 475 200, 485 205 C 485 235, 455 280, 420 282 Z" fill="url(#leafGrad)" />
    <path d="M 415 273 Q 450 240 475 210" fill="none" stroke="#15803d" stroke-width="2.5" stroke-linecap="round" opacity="0.4" />
  </g>

  <!-- CLOCK / TIMER (Overlapping lower right of clipboard) -->
  <g filter="url(#shadow)">
    <!-- Clock Outer Ring -->
    <circle cx="370" cy="305" r="75" fill="#ffffff" stroke="url(#clockGrad)" stroke-width="19" />

    <!-- Hour Markers -->
    <!-- 12 o'clock -->
    <line x1="370" y1="245" x2="370" y2="258" stroke="#1e293b" stroke-width="4.5" stroke-linecap="round" />
    <!-- 3 o'clock -->
    <line x1="430" y1="305" x2="417" y2="305" stroke="#1e293b" stroke-width="4.5" stroke-linecap="round" />
    <!-- 6 o'clock -->
    <line x1="370" y1="365" x2="370" y2="352" stroke="#1e293b" stroke-width="4.5" stroke-linecap="round" />
    <!-- 9 o'clock -->
    <line x1="310" y1="305" x2="323" y2="305" stroke="#1e293b" stroke-width="4.5" stroke-linecap="round" />

    <!-- Minor Ticks -->
    <line x1="340" y1="253" x2="345" y2="262" stroke="#64748b" stroke-width="3.5" stroke-linecap="round" />
    <line x1="400" y1="253" x2="395" y2="262" stroke="#64748b" stroke-width="3.5" stroke-linecap="round" />
    <line x1="422" y1="275" x2="413" y2="280" stroke="#64748b" stroke-width="3.5" stroke-linecap="round" />
    <line x1="422" y1="335" x2="413" y2="330" stroke="#64748b" stroke-width="3.5" stroke-linecap="round" />

    <!-- Clock Hands (Pointing to approx 1:08) -->
    <!-- Hour Hand -->
    <line x1="370" y1="305" x2="398" y2="277" stroke="#1e3a8a" stroke-width="7" stroke-linecap="round" />
    <!-- Center Green Hub -->
    <circle cx="370" cy="305" r="10" fill="#16a34a" />
    <circle cx="370" cy="305" r="4.5" fill="#ffffff" />
  </g>

  <!-- TYPOGRAPHY: Daily Task Tracker -->
  <g text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif">
    <!-- Line 1: Daily Task -->
    <text x="300" y="445" font-size="52" font-weight="900" letter-spacing="-1">
      <tspan fill="#0f2b48">Daily </tspan>
      <tspan fill="#16a34a">Task</tspan>
    </text>

    <!-- Line 2: Tracker -->
    <text x="300" y="500" font-size="52" font-weight="900" fill="#0f2b48" letter-spacing="-1">
      Tracker
    </text>

    <!-- Line 3: Accent Green Pill Bar -->
    <rect x="250" y="518" width="100" height="8" rx="4" fill="#16a34a" />
  </g>
</svg>
